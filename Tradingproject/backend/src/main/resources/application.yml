spring:
  application:
    name: signal-backend

  mvc:
    async:
      # The full feature export is streamed (see IntradayFeatureExportController); Spring's default 30 s async
      # timeout cut it off for any client slower than the VM itself. 15 minutes is far above any real download.
      request-timeout: 900000

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:trading_signals}
    username: ${DB_USER:trading_signals}
    password: ${DB_PASSWORD:trading_signals}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  quartz:
    job-store-type: memory

upstox:
  base-url: https://api.upstox.com
  api-key: ${UPSTOX_API_KEY:}
  api-secret: ${UPSTOX_API_SECRET:}
  redirect-uri: ${UPSTOX_REDIRECT_URI:http://localhost:8080/auth/upstox/callback}

github-dispatch:
  token: ${GITHUB_DISPATCH_TOKEN:}
  repo: JerinBenito/jTrading
  workflow-file: daily-ai-prediction.yml
  screen-workflow-file: daily-screen.yml

server:
  port: ${SERVER_PORT:8080}
  # The daily AI run downloads /api/ml/intraday-features/all (~181 MB of JSON, growing daily); JSON
  # compresses ~10x, which cuts that download from ~85 s to a few seconds. Clients opt in with Accept-Encoding.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 4096

management:
  endpoints:
    web:
      exposure:
        include: health,info
