services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-signals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_signals
      POSTGRES_USER: trading_signals
      POSTGRES_PASSWORD: trading_signals
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_signals -d trading_signals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
