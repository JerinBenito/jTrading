name: Daily Market Screen

# Builds the end-of-day NIFTY 50 screen (Tradingproject/ml-training/daily_screen.py) after the close and
# pushes it to the backend for the app's Screen tab: market context, per-stock evidence dossiers, ranked
# lists, next-session hypotheses, and last session's hypotheses scored. Talks only to the public backend
# API; no secrets. Descriptive statistics, not recommendations.
on:
  schedule:
    # 13:50 UTC = 19:20 IST, weekdays: NSE's F&O bhavcopy (the source of the option-implied volatility the risk model uses) is
    # published around 18:30-19:30 IST, and the script waits up to 75 minutes for it, then goes without if it never appears
    # (or if NSE cannot be reached from the runner). GitHub's scheduler can run late; the script upserts by session date,
    # so a second run the same evening is harmless. The backend's own scheduler dispatches this at 19:20 and 20:30 IST.
    - cron: "50 13 * * 1-5"
    - cron: "0 15 * * 1-5"    # backup in case the first slot was skipped
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tradingproject/ml-training
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Tradingproject/ml-training
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy scipy lightgbm scikit-learn

      - run: python daily_screen.py --wait-minutes 45 --wait-iv-minutes 75
