name: Daily AI Prediction

# Runs the AI prediction ledger script (Tradingproject/ml-training/run_daily_ai_prediction.py)
# on GitHub's own runners — deliberately NOT dependent on any local machine being on. Talks only
# to the public backend API (jerintradingsignal.duckdns.org) over HTTPS; no secrets needed.
on:
  schedule:
    # GitHub's scheduled runs are best-effort, not guaranteed-on-time — a single 10:05 IST slot
    # was observed running ~5 hours late (near market close, useless for an intraday prediction).
    # Firing every 10 min across 08:30-10:29 IST instead (03:00-04:59 UTC), weekdays only, so at
    # least one attempt is likely to land soon after market open (9:15 IST). The script itself is
    # idempotent (see already_ran_today() in run_daily_ai_prediction.py) — every firing after the
    # first successful one each day is a cheap no-op, not a duplicate/overwrite.
    - cron: "*/10 3,4 * * 1-5"
  workflow_dispatch: {} # manual "Run workflow" button for on-demand testing

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tradingproject/ml-training
    steps:
      - uses: actions/checkout@v4
        with:
          # This repo root also holds large, unrelated projects (Services/, FrontEnd/, etc.) —
          # sparse checkout keeps this workflow from trying to pull all of that down.
          sparse-checkout: |
            Tradingproject/ml-training
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python run_daily_ai_prediction.py

      - uses: actions/upload-artifact@v4
        # Only the first successful firing each day actually trains/saves models (redundant
        # later firings skip via already_ran_today()); if-no-files-found handles that gracefully
        # instead of failing the workflow. This is what makes each day's live predictions traceable
        # to a real, downloadable model file (see model_version = lgbm-v1-run<GITHUB_RUN_ID>).
        with:
          name: ai-models-${{ github.run_id }}
          path: Tradingproject/ml-training/models/
          if-no-files-found: ignore
          retention-days: 90
